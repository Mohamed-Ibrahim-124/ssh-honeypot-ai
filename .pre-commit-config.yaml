repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(venv/|env/|__pycache__/|\.git/|\.pytest_cache/|\.mypy_cache/|\.ruff_cache/|node_modules/|site-packages/|Scripts/|build/|dist/|\.tox/|\.nox/)
      - id: ruff-format
        exclude: ^(venv/|env/|__pycache__/|\.git/|\.pytest_cache/|\.mypy_cache/|\.ruff_cache/|node_modules/|site-packages/|Scripts/|build/|dist/|\.tox/|\.nox/)

  # Mypy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        exclude: ^(venv/|env/|__pycache__/|\.git/|\.pytest_cache/|\.mypy_cache/|\.ruff_cache/|node_modules/|site-packages/|Scripts/|build/|dist/|\.tox/|\.nox/)

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-r', '.', '-f', 'json', '-o', 'bandit-report.json']
        exclude: ^(venv/|env/|__pycache__/|\.git/|\.pytest_cache/|\.mypy_cache/|\.ruff_cache/|node_modules/|site-packages/|Scripts/|build/|dist/|\.tox/|\.nox/)

  # Vulture - Dead code detector
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.10
    hooks:
      - id: vulture
        args: [--min-confidence, '80', '--exclude', 'venv/', '--exclude', 'env/', '--exclude', '__pycache__/', '--exclude', '.git/', '--exclude', '.pytest_cache/', '--exclude', '.mypy_cache/', '--exclude', '.ruff_cache/', '--exclude', 'site-packages/', '--exclude', 'Scripts/']
        exclude: ^(venv/|env/|__pycache__/|\.git/|\.pytest_cache/|\.mypy_cache/|\.ruff_cache/|node_modules/|site-packages/|Scripts/|build/|dist/|\.tox/|\.nox/)

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: debug-statements
      - id: check-docstring-first

  # Python-specific hooks
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  # Security checks
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check

# Configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [mypy, bandit, vulture, safety]  # Skip heavy checks in CI
  submodules: false
